name: responsive_cloud_image
description: "A CDN-agnostic responsive image loader that dynamically calculates widget bounds and requests optimized images from Supabase, Cloudinary, Imgix, Unsplash, Shopify, and more."
version: 1.0.1
homepage: https://github.com/hbsgujjar111/responsive_cloud_image
repository: https://github.com/hbsgujjar111/responsive_cloud_image
issue_tracker: https://github.com/hbsgujjar111/responsive_cloud_image/issues

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1 # Standard trusted caching engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
