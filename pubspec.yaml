name: responsive_cloud_image
description: "A CDN-agnostic responsive image loader that dynamically calculates widget bounds and requests optimized images from Supabase, Cloudinary, Imgix, Unsplash, Shopify, and more."
version: 1.1.0
homepage: https://github.com/hbsgujjar111/responsive_cloud_image
repository: https://github.com/hbsgujjar111/responsive_cloud_image
issue_tracker: https://github.com/hbsgujjar111/responsive_cloud_image/issues

topics:
  - image
  - cdn
  - cache
  - responsive
  - network

screenshots:
  - description: 'The demo app loading the same image from several CDNs at the size each widget needs.'
    path: example/mobile-example.webp

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ">=3.4.1 <5.0.0" # Standard trusted caching engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
